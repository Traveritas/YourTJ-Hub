<!doctype html>
<html lang="zh-CN" data-theme="gf-light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  window.addEventListener('error', (e) => {
    document.title = 'PAGEERR: ' + (e.message || e.error || 'unknown')
    const d = document.createElement('pre')
    d.style.cssText = 'color:#b91c1c;background:#fff;padding:12px;white-space:pre-wrap'
    d.textContent = 'ERROR: ' + (e.error && e.error.stack ? e.error.stack : e.message)
    document.body.appendChild(d)
  })
  window.addEventListener('unhandledrejection', (e) => {
    const d = document.createElement('pre')
    d.style.cssText = 'color:#b91c1c;background:#fff;padding:12px;white-space:pre-wrap'
    d.textContent = 'REJECTION: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason)
    document.body.appendChild(d)
  })
</script>
</head>
<body style="margin:0">
<div id="app"></div>
<script type="module" src="./avatar-badge-live.ts"></script>
</body>
</html>
